name: Release

# Releases are deliberate, not a side effect of merging. Nothing fires on a push
# to main any more — a promotion used to cut a tag every time.
#
# workflow_dispatch is the normal path (run it when there is something to ship).
# The weekly schedule is the floor: a maintainer absent for months must not leave
# security updates sitting on develop, unreleased.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force version bump type (leave empty for auto-detect)"
        required: false
        type: choice
        options:
          - ""
          - "patch"
          - "minor"
          - "major"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Promote develop -> main through a PR, not a direct push. main-protection
  # requires a pull request and four checks, and nothing here is exempt from it:
  # the PR is approved by the automerge workflow's author allowlist and merged by
  # auto-merge once CI is green.
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Open promotion PR and wait for it to merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet origin/main origin/develop; then
            echo "develop and main are identical — nothing to promote."
            exit 0
          fi

          pr=$(gh pr list --base main --head develop --state open \
                 --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head develop \
                   --title "release: promote develop to main" \
                   --body "Automated promotion. Merged by auto-merge once CI is green." \
                   | grep -oE '[0-9]+$')
            echo "opened PR #$pr"
          else
            echo "reusing open PR #$pr"
          fi

          gh pr merge --auto --merge "$pr"

          # Auto-merge lands the PR asynchronously once checks pass.
          for _ in $(seq 1 60); do
            state=$(gh pr view "$pr" --json state --jq .state)
            [ "$state" = "MERGED" ] && { echo "promotion merged"; exit 0; }
            [ "$state" = "CLOSED" ] && { echo "::error::promotion PR was closed"; exit 1; }
            sleep 30
          done
          echo "::error::promotion PR #$pr did not merge within 30 minutes"
          exit 1

  # Re-run the suite against main as it now stands, before anything is tagged.
  verify:
    needs: promote
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: main
          fetch-depth: 0

      # Tag-only. setuptools-scm derives the version from the tag, so there is no
      # file to write and no commit to make — which means no push to a protected
      # branch and no bypass actor anywhere. Rulesets cover branches, not tags.
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757  # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ github.event.inputs.force || '' }}
          commit: "false"
          changelog: "false"
          tag: "true"
          push: "true"
          vcs_release: "true"
          build: "false"

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
