[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roustabout"
dynamic = ["version"]
description = "Docker environment documentation, security auditing, and safe MCP server"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Cron", email = "cron@featurecreep.dev" },
    { name = "Chris", email = "chris@featurecreep.dev" },
]
readme = "README.md"
keywords = ["docker", "documentation", "compose", "markdown", "security", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click==8.5.0",
    "ruamel.yaml==0.19.1",
    "secretscreen==0.5.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[project.urls]
Homepage = "https://github.com/featurecreep-cron/roustabout"
Repository = "https://github.com/featurecreep-cron/roustabout"
Issues = "https://github.com/featurecreep-cron/roustabout/issues"

[project.optional-dependencies]
mcp = [
    "mcp==2.1.1",
]
server = [
    "docker==7.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[project.scripts]
roustabout = "roustabout.cli:main"
roustabout-mcp = "roustabout.mcp_proxy.server:main"
roustabout-server = "roustabout.api.server:main"

[tool.setuptools_scm]
# The git tag is the single source of the version. Nothing writes it into a file,
# so pyproject and the tag cannot drift apart the way they did in Aug 2026.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["docker.*", "ruamel.*", "mcp.*", "tomli", "fastapi.*", "uvicorn.*", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["roustabout.mcp_proxy.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
commit_parser = "conventional"

tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "deps"]
allowed_tags = [
    "feat", "fix", "perf", "deps",
    "build", "chore", "ci", "docs", "style", "refactor", "test",
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore(\\(.*\\))?:",
    "^ci(\\(.*\\))?:",
    "^docs(\\(.*\\))?:",
    "^style(\\(.*\\))?:",
]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
